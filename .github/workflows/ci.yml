name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Bash syntax
        run: bash -n scripts/system_health.sh

      - name: Run tests
        run: pytest -q

      - name: Validate Ansible playbook syntax
        run: ansible-playbook -i ansible/inventory.example.ini ansible/playbooks/configure_compute_node.yml --syntax-check
